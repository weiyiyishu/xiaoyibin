<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>登录 - 图书管理系统</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-side">
    <div class="logo-box">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
    </div>
    <h1>图书管理系统</h1>
    <p>知识管理，从这里开始</p>
  </div>

  <div class="auth-main">
    <div class="auth-card">
      <div class="card auth-box">
        <h2>欢迎回来</h2>
        <p class="sub">登录您的账号以继续</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
          <div class="form-group">
            <label>用户名 <span class="required">*</span></label>
            <input class="form-control" type="text" name="username" placeholder="请输入用户名" required/>
          </div>
          <div class="form-group">
            <label>密码 <span class="required">*</span></label>
            <input class="form-control" type="password" name="password" placeholder="请输入密码" required/>
          </div>
          <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>

        <div class="auth-footer">
          还没有账号？<a th:href="@{/register}">立即注册</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
