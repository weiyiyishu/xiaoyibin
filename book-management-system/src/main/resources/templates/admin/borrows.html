<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:with="activePage='adminBorrow'">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>借阅记录 - 图书管理系统</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="page">
  <div class="page-header">
    <div>
      <h1>借阅记录</h1>
      <p class="sub">查看全部读者的借书与还书情况</p>
    </div>
  </div>

  <!-- 搜索栏 -->
  <div class="card search-bar">
    <form class="search-form" th:action="@{/admin/borrows}" method="get">
      <input type="text" name="keyword" th:value="${keyword}"
             placeholder="搜索书名、用户名…"/>
      <select name="status" class="form-control" style="width:140px">
        <option value="" th:selected="${status == ''}">全部状态</option>
        <option value="borrowing" th:selected="${status == 'borrowing'}">借阅中</option>
        <option value="returned" th:selected="${status == 'returned'}">已归还</option>
      </select>
      <button type="submit" class="btn btn-outline">搜索</button>
    </form>
  </div>

  <!-- 记录表格 -->
  <div class="card" th:if="${pageInfo.records != null and !#lists.isEmpty(pageInfo.records)}">
    <div class="table-wrap">
      <table class="table">
        <thead>
        <tr>
          <th>封面</th>
          <th>书名</th>
          <th>借阅人</th>
          <th>借出时间</th>
          <th>应还时间</th>
          <th>归还时间</th>
          <th>状态</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${pageInfo.records}">
          <td>
            <a th:href="@{/books/{id}(id=${r.bookId})}">
              <img th:if="${r.coverUrl != null and !#strings.isEmpty(r.coverUrl)}"
                   class="cover-thumb" th:src="${r.coverUrl}" th:alt="${r.bookTitle}"/>
              <div th:unless="${r.coverUrl != null and !#strings.isEmpty(r.coverUrl)}"
                   class="cover-thumb-ph">书</div>
            </a>
          </td>
          <td>
            <a th:href="@{/books/{id}(id=${r.bookId})}"
               style="font-weight:500" th:text="${r.bookTitle}"></a>
          </td>
          <td>
            <span th:text="${r.displayName} ?: ${r.username}"></span>
            <span class="muted-small" th:if="${r.username != null}"
                  th:text="|（${r.username}）|"></span>
          </td>
          <td th:text="${#temporals.format(r.borrowAt, 'yyyy-MM-dd')}"></td>
          <td th:text="${#temporals.format(r.dueAt, 'yyyy-MM-dd')}"></td>
          <td th:text="${r.returnAt != null} ? ${#temporals.format(r.returnAt, 'yyyy-MM-dd HH:mm')} : '-'"></td>
          <td>
            <span class="badge badge-danger" th:if="${r.overdue}">已逾期</span>
            <span class="badge badge-success" th:if="${!r.overdue and r.status == 'borrowing'}">借阅中</span>
            <span class="badge badge-muted" th:if="${r.status == 'returned'}">已归还</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="table-footer">
      <span th:text="|共 ${pageInfo.total} 条，第 ${pageInfo.current} / ${pageInfo.pages} 页|"></span>
      <div class="pagination small">
        <a class="page-btn" th:classappend="${pageInfo.current <= 1} ? 'disabled'"
           th:href="@{/admin/borrows(page=${pageInfo.current <= 1 ? 1 : pageInfo.current - 1}, keyword=${keyword}, status=${status})}">上一页</a>
        <a class="page-btn" th:classappend="${pageInfo.current >= pageInfo.pages} ? 'disabled'"
           th:href="@{/admin/borrows(page=${pageInfo.current >= pageInfo.pages ? pageInfo.pages : pageInfo.current + 1}, keyword=${keyword}, status=${status})}">下一页</a>
      </div>
    </div>
  </div>

  <!-- 空状态 -->
  <div class="empty" th:if="${pageInfo.records == null or #lists.isEmpty(pageInfo.records)}">
    <p class="empty-title">暂无借阅记录</p>
    <p th:text="${keyword != '' or status != ''} ? '没有符合筛选条件的记录' : '还没有读者借过书'"></p>
  </div>
</div>

</body>
</html>
